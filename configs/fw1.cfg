! ROLE: Edge firewall/router fw1 - uplink to r1, outside interface, DMZ
!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname fw1
!
enable secret 5 $1$Vf5j$Rt1xNc8bPe6hYq3wLz0Ud.
!
no ip domain lookup
ip domain name lab.example.net
ip ssh version 2
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
!
interface GigabitEthernet0/0
 description OUTSIDE-INTERNET
 ip address 203.0.113.2 255.255.255.252
 ip access-group OUTSIDE-IN in
 no shutdown
!
interface GigabitEthernet0/1
 description INSIDE-TO-R1
 ip address 10.0.1.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description DMZ
 ip address 10.20.20.1 255.255.255.0
 no shutdown
!
router ospf 1
 router-id 3.3.3.3
 passive-interface GigabitEthernet0/0
 network 3.3.3.3 0.0.0.0 area 0
 network 10.0.1.0 0.0.0.3 area 0
 network 10.20.20.0 0.0.0.255 area 0
 default-information originate always
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
ip access-list extended OUTSIDE-IN
 deny   ip 10.0.0.0 0.255.255.255 any log
 deny   ip 172.16.0.0 0.15.255.255 any log
 deny   ip 192.168.0.0 0.0.255.255 any log
 permit tcp any host 10.20.20.130 eq 443
 permit icmp any any echo-reply
 deny   ip any any log
!
access-list 10 permit 10.10.10.0 0.0.0.255
access-list 10 permit 10.20.10.0 0.0.0.255
access-list 10 deny   any log
!
snmp-server community Fw1-Ro-c6Hy2Ws RO 10
!
line con 0
 logging synchronous
line vty 0 4
 access-class 10 in
 login local
 transport input ssh
!
end
