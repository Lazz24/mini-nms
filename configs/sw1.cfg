! ROLE: L2 access switch sw1 - trunk to r1, VLAN 10 users / VLAN 20 servers
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname sw1
!
enable secret 5 $1$Bt4k$Ld8eRmW1xQ5nZs0yHj3Pc.
!
no ip domain lookup
ip domain name lab.example.net
ip ssh version 2
!
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 30
 name GUEST
!
spanning-tree mode rapid-pvst
!
interface GigabitEthernet0/1
 description TRUNK-TO-R1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10
 no shutdown
!
interface FastEthernet0/1
 description USER-PC-1
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/2
 description USER-PC-2
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/5
 description USER-PC-3
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/10
 description SERVER-APP-1
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!
interface Vlan10
 ip address 10.10.10.2 255.255.255.0
 no shutdown
!
ip default-gateway 10.10.10.1
!
access-list 10 permit 10.10.10.0 0.0.0.255
access-list 10 deny   any log
!
snmp-server community Sw1-Ro-p4Tz8Vn RO 10
!
line con 0
 logging synchronous
line vty 0 4
 access-class 10 in
 login local
 transport input ssh
!
end
