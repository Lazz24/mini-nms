! ROLE: L2 access switch sw2 - trunk to r2, VLAN 10 users / VLAN 20 servers
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname sw2
!
enable secret 5 $1$Hn6c$Qy2vTb9sKd4fWe7uMa1Xg/
!
no ip domain lookup
ip domain name lab.example.net
ip ssh version 2
!
vlan 10
 name USERS
vlan 20
 name SERVERS
!
spanning-tree mode rapid-pvst
!
interface GigabitEthernet0/1
 description TRUNK-TO-R2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20
 no shutdown
!
interface FastEthernet0/1
 description USER-PC-4
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/2
 description SERVER-DB-1
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 shutdown
!
interface FastEthernet0/3
 description SERVER-APP-2
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!
interface Vlan10
 ip address 10.20.10.2 255.255.255.0
 no shutdown
!
ip default-gateway 10.20.10.1
!
access-list 10 permit 10.20.10.0 0.0.0.255
access-list 10 deny   any log
!
snmp-server community Sw2-Ro-m8Jd3Qa RO 10
!
line con 0
 logging synchronous
line vty 0 4
 access-class 10 in
 login local
 transport input ssh
!
end
