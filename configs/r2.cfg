! ROLE: Core router r2 - OSPF to r1, trunk to sw2 (VLAN 10/20 gateways)
!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname r2
!
enable secret 5 $1$zQ7a$Wn3LkP0dT9uYb2cVh8sRe1
!
no ip domain lookup
ip domain name lab.example.net
ip ssh version 2
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK-TO-R1
 ip address 10.0.12.2 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
interface GigabitEthernet0/1
 description TRUNK-TO-SW2
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.10
 description VLAN10-USERS
 encapsulation dot1Q 10
 ip address 10.20.10.1 255.255.255.0
 ip access-group USERS-IN in
!
interface GigabitEthernet0/1.20
 description VLAN20-SERVERS
 encapsulation dot1Q 20
 ip address 10.20.20.1 255.255.255.0
!
router ospf 1
 router-id 2.2.2.2
 passive-interface GigabitEthernet0/1.10
 passive-interface GigabitEthernet0/1.20
 network 2.2.2.2 0.0.0.0 area 0
 network 10.0.12.0 0.0.0.3 area 0
 network 10.20.10.0 0.0.0.255 area 0
 network 10.20.20.0 0.0.0.255 area 0
!
ip access-list extended USERS-IN
 permit tcp 10.20.10.0 0.0.0.255 10.20.20.0 0.0.0.255 eq 443
 permit udp 10.20.10.0 0.0.0.255 any eq 53
 deny   ip 10.20.10.0 0.0.0.255 10.20.20.0 0.0.0.255 log
 permit ip 10.20.10.0 0.0.0.255 any
!
access-list 10 permit 10.20.10.0 0.0.0.255
access-list 10 deny   any log
!
snmp-server community public RO
snmp-server location DC1-Rack2
!
line con 0
 logging synchronous
line vty 0 4
 access-class 10 in
 login local
 transport input ssh
!
end
